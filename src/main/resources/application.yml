spring:
  application:
    name: payment-gateway
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

payment:
  max-error-attempts: 3
  api-key: ${PAYMENT_GATEWAY_API_KEY}
  card-fingerprint-secret: ${CARD_FINGERPRINT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
